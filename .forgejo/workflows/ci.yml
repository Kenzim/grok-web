# CI for grok-web. Avoid actions/checkout and actions/setup-*: data.forgejo.org
# TLS flakes (gnutls SNI) on this rootless slirp4netns runner.

name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    timeout-minutes: 25
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init
          git remote add origin "http://192.168.11.92:3000/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GIT_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git reset --hard "${GITHUB_SHA}"

      - name: Set up Python
        run: |
          set -eu
          if ! python3 -c 'import venv' 2>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv python3-pip
          fi
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install --upgrade pip
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
          echo "PATH=${RUNNER_TEMP}/venv/bin:${PATH}" >> "${GITHUB_ENV}"

      - name: Set up Node
        run: |
          set -eu
          if ! command -v node >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y -qq nodejs
          fi
          node --version
          npm --version

      - name: Install Python deps
        run: |
          git clone --depth 1 "http://192.168.11.92:3000/kenzim/grokbot-client.git" "${RUNNER_TEMP}/grokbot-client"
          python3 -m pip install -e "${RUNNER_TEMP}/grokbot-client"
          python3 -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check backend tests

      - name: Pytest
        run: pytest -q

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run test:coverage
