sonar.projectKey=kenzim_grok-web
sonar.projectName=grok-web
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.tests=tests,frontend/src

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=**/__pycache__/**,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**
sonar.test.inclusions=tests/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=tests/**,**/*.test.ts,**/*.test.tsx,frontend/src/main.tsx,frontend/src/vite-env.d.ts,frontend/src/setupTests.ts

# Do not set sonar.dependencyCheck.jsonReportPath. Importing CVEs fails new_violations=0.
